name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:

  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Unpack Ffmpeg
        run: .\src\init.ps1
        
      - name: Dotnet publish
        run: dotnet publish src/VivaMusic.csproj -c Release -r win-x64

      - name: Verify FFmpeg exists before packing
        run: |
          $ffmpegPath = "src/bin/Release/net10.0/win-x64/publish/External/ffmpeg.exe"
          if (-not (Test-Path $ffmpegPath)) {
            Write-Error "CRITICAL: ffmpeg.exe is missing in publish folder!"
            exit 1
          }

      - name: Compile setup
        run: iscc src/setup.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: src/Output/VivaMusic_setup_*.exe
          if-no-files-found: error

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: src/Output/VivaMusic_setup_*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files:  src/Output/VivaMusic_setup_*.exe
          generate_release_notes: true
          prerelease: true
          draft: true
          make_latest: true
